<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#archBg)" stroke="#334155" stroke-width="1.5"/>

  <text x="44" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">HisabMate Clean MVVM + Unidirectional StateFlow Architecture</text>
  <text x="44" y="70" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500">100% Offline-First Reactive Pipeline • Jetpack Compose M3 ⇄ HisabViewModel &amp; ISO 4217 FX Engine ⇄ Room SQLite v5</text>

  <!-- Animated Connector Bridges -->
  <path id="bridge1" d="M 392 215 L 448 215" stroke="url(#pipeGrad)" stroke-width="3" stroke-dasharray="6 6"/>
  <circle r="5.5" fill="#A78BFA">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 392 215 L 448 215"/>
  </circle>
  <circle r="5.5" fill="#38BDF8">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M 448 215 L 392 215"/>
  </circle>

  <path id="bridge2" d="M 752 215 L 808 215" stroke="url(#pipeGrad)" stroke-width="3" stroke-dasharray="6 6"/>
  <circle r="5.5" fill="#38BDF8">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 752 215 L 808 215"/>
  </circle>
  <circle r="5.5" fill="#34D399">
    <animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M 808 215 L 752 215"/>
  </circle>

  <!-- Node 1: UI Layer -->
  <g transform="translate(44, 102)">
    <rect width="348" height="246" rx="20" fill="#131C31" stroke="#7C5CFF" stroke-width="1.5"/>
    <rect x="20" y="20" width="128" height="26" rx="13" fill="#2E1065"/>
    <text x="84" y="37" text-anchor="middle" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">PRESENTATION LAYER</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="19" font-weight="800">Jetpack Compose M3 UI</text>
    <text x="20" y="98" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• DashboardScreen &amp; Quick Folders</text>
    <text x="20" y="122" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• Accounts, Cards &amp; MFS Wallets</text>
    <text x="20" y="146" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• Planning Hub (Budgets, Bills, Debt, Goals)</text>
    <text x="20" y="170" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• Currencies &amp; Offline FX Converter</text>
    <text x="20" y="194" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• 7-Step Interactive Onboarding &amp; PIN Lock</text>
    <text x="20" y="224" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="12" font-weight="700">collectAsStateWithLifecycle()</text>
  </g>

  <!-- Node 2: Domain & ViewModel Layer -->
  <g transform="translate(448, 102)">
    <rect width="304" height="246" rx="20" fill="#131C31" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="20" y="20" width="150" height="26" rx="13" fill="#0C4A6E"/>
    <text x="95" y="37" text-anchor="middle" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">DOMAIN &amp; STATE ENGINE</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="19" font-weight="800">HisabViewModel + FX</text>
    <text x="20" y="98" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• Consolidated Multi-Currency State</text>
    <text x="20" y="122" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• CurrencyCatalog (14 ISO Currencies)</text>
    <text x="20" y="146" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• Cross-Currency Transfer Math</text>
    <text x="20" y="170" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• Budget Threshold Evaluators</text>
    <text x="20" y="194" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• AlarmManager Reminder Scheduler</text>
    <text x="20" y="224" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">StateFlow&lt;HisabUiState&gt;</text>
  </g>

  <!-- Node 3: Data & Persistence Layer -->
  <g transform="translate(808, 102)">
    <rect width="348" height="246" rx="20" fill="#131C31" stroke="#10B981" stroke-width="1.5"/>
    <rect x="20" y="20" width="144" height="26" rx="13" fill="#064E3B"/>
    <text x="92" y="37" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">PERSISTENCE LAYER</text>
    <text x="20" y="72" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="19" font-weight="800">Room SQLite v5 + Backup</text>
    <text x="20" y="98" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• 10 Relational Entities (Native ISO Code)</text>
    <text x="20" y="122" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• Transactional Flow DAOs (HisabDao)</text>
    <text x="20" y="146" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• JSON Full Backup &amp; Restore Engine</text>
    <text x="20" y="170" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• CSV Spreadsheet Export/Import</text>
    <text x="20" y="194" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">• Printable PDF Statement Generator</text>
    <text x="20" y="224" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">100% On-Device Storage</text>
  </g>

  <!-- Bottom Status Strip -->
  <text x="600" y="388" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">
    Verified by Automated Robolectric JVM + Compose UI Test Suite • Zero Network Calls • Deterministic Currency Conversion
  </text>
</svg>