name: Normalize GitHub Release Title and Notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalize-release-title.yml"

permissions:
  contents: write

jobs:
  update-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Synchronize v1.0.6 release title and verified notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.0.6 --repo "$GITHUB_REPOSITORY" --title "HisabMate v1.0.6" --notes-file docs/releases/v1.0.6.md
