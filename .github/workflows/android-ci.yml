name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint, Robolectric Test & Release Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment & Debug Keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint Verification
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --stacktrace


      - name: Package Debug APK for Device Preview
        run: |
          mkdir -p ci-debug-output
          cp app/build/outputs/apk/debug/*.apk ci-debug-output/HisabMate-v1.0.6-debug.apk
          (cd ci-debug-output && sha256sum HisabMate-v1.0.6-debug.apk > SHA256SUMS.txt)

      - name: Upload Debug APK Preview
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hisabmate-v1.0.6-debug-apk
          path: ci-debug-output/*
          if-no-files-found: error

      - name: Assemble & Verify Release APK and AAB
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TEMP_KS="${RUNNER_TEMP}/ci-upload-key.jks"
          rm -f "$TEMP_KS"
          set -euo pipefail
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] || [ -n "$STORE_PASSWORD" ] || [ -n "$KEY_PASSWORD" ]; then
            if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Signing secrets are partially configured. Set all required secrets or leave all unset for verification-only signing."
              exit 1
            fi
            if [ -n "$KEY_ALIAS" ] && [ "$KEY_ALIAS" != "upload" ]; then
              echo "::error::The configured keystore alias must be 'upload' to match app/build.gradle.kts."
              exit 1
            fi
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$TEMP_KS"
            keytool -list -keystore "$TEMP_KS" -storepass "$STORE_PASSWORD" -alias upload >/dev/null
            export KEYSTORE_PATH="$TEMP_KS"
            echo "Using the configured persistent upload keystore for CI verification."
          else
            echo "No production signing secrets configured; using an ephemeral key for verification only. No release artifact is published by this workflow."
            keytool -genkeypair -v \
              -keystore "$TEMP_KS" \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "HisabMateCiVerify2026!" \
              -keypass "HisabMateCiVerify2026!" \
              -dname "CN=HisabMate CI Verification, OU=Engineering, O=CodeByArnob, L=Dhaka, S=Dhaka, C=BD"
            export KEYSTORE_PATH="$TEMP_KS"
            export STORE_PASSWORD="HisabMateCiVerify2026!"
            export KEY_PASSWORD="HisabMateCiVerify2026!"
          fi

          gradle :app:assembleRelease :app:bundleRelease --stacktrace
          rm -f "$TEMP_KS"

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          AAPT2=$(find "${ANDROID_HOME}/build-tools" -name "aapt2" | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk
          "$AAPT2" dump badging app/build/outputs/apk/release/*.apk | head -n 15
          jarsigner -verify app/build/outputs/bundle/release/*.aab

      - name: Upload Unit Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*

