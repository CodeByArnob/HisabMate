name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint, Robolectric Test & Release Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment & Debug Keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint Verification
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Assemble & Verify Release APK and AAB
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TEMP_KS="${RUNNER_TEMP}/ci-upload-key.jks"
          rm -f "$TEMP_KS"
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using configured GitHub Actions production upload keystore secret."
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$TEMP_KS"
            if [ -n "$KEY_ALIAS" ] && [ "$KEY_ALIAS" != "upload" ]; then
              keytool -changealias -keystore "$TEMP_KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -destalias "upload" -keypass "$KEY_PASSWORD" || true
            fi
            export KEYSTORE_PATH="$TEMP_KS"
          else
            echo "Production signing secrets not configured; generating ephemeral CI keystore in RUNNER_TEMP to verify :app:assembleRelease and :app:bundleRelease tasks."
            keytool -genkeypair -v \
              -keystore "$TEMP_KS" \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "HisabMateCiVerify2026!" \
              -keypass "HisabMateCiVerify2026!" \
              -dname "CN=HisabMate CI Verification, OU=Engineering, O=CodeByArnob, L=Dhaka, S=Dhaka, C=BD"
            export KEYSTORE_PATH="$TEMP_KS"
            export STORE_PASSWORD="HisabMateCiVerify2026!"
            export KEY_PASSWORD="HisabMateCiVerify2026!"
          fi

          gradle :app:assembleRelease :app:bundleRelease --stacktrace
          rm -f "$TEMP_KS"

          mkdir -p ci-release-outputs
          cp app/build/outputs/apk/release/*.apk ci-release-outputs/HisabMate-v1.0.3-release.apk
          cp app/build/outputs/bundle/release/*.aab ci-release-outputs/HisabMate-v1.0.3-release.aab
          (cd ci-release-outputs && sha256sum HisabMate-v1.0.3-release.apk HisabMate-v1.0.3-release.aab > SHA256SUMS.txt)

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          AAPT2=$(find "${ANDROID_HOME}/build-tools" -name "aapt2" | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose ci-release-outputs/HisabMate-v1.0.3-release.apk
          "$AAPT2" dump badging ci-release-outputs/HisabMate-v1.0.3-release.apk | head -n 15

      - name: Upload Unit Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*

      - name: Upload Release APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hisabmate-release-artifacts
          path: ci-release-outputs/*
