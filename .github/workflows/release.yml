name: Release Build & Artifact Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release-artifacts:
    name: Build & Verify Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Environment
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Full Robolectric Verification Suite
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Signed Production Release (When Signing Secrets Present)
        if: ${{ env.UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
          gradle :app:assembleRelease :app:bundleRelease --stacktrace
          mkdir -p release-dist
          cp app/build/outputs/apk/release/*.apk release-dist/HisabMate-${GITHUB_REF_NAME:-v1.0.0}-release.apk
          cp app/build/outputs/bundle/release/*.aab release-dist/HisabMate-${GITHUB_REF_NAME:-v1.0.0}-release.aab
          cd release-dist && sha256sum * > SHA256SUMS.txt
          rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

      - name: Upload Signed Release Assets
        if: ${{ env.UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: hisabmate-signed-release
          path: release-dist/*
