name: Release Build & Artifact Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v1.0.3)'
        required: true
        default: 'v1.0.3'

permissions:
  contents: write

jobs:
  release-artifacts:
    name: Build, Sign & Attach Release APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit, Robolectric & Lint Verification Suite
        run: gradle :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build & Verify Release APK and Android App Bundle (AAB)
        id: build_release
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          INPUT_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REL_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            REL_TAG="${INPUT_TAG}"
          else
            REL_TAG="v1.0.3"
          fi
          echo "release_tag=${REL_TAG}" >> "$GITHUB_OUTPUT"

          TEMP_KS="${RUNNER_TEMP}/release-upload-key.jks"
          rm -f "$TEMP_KS"

          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "signing_status=SIGNED_WITH_REPOSITORY_SECRETS" >> "$GITHUB_OUTPUT"
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$TEMP_KS"
            if [ -n "$KEY_ALIAS" ] && [ "$KEY_ALIAS" != "upload" ]; then
              keytool -changealias -keystore "$TEMP_KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -destalias "upload" -keypass "$KEY_PASSWORD" || true
            fi
            export KEYSTORE_PATH="$TEMP_KS"
          else
            echo "signing_status=EPHEMERAL_RELEASE_KEY_SECRETS_NOT_CONFIGURED" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Production Signing Secrets Not Configured in Repository Settings"
              echo "The repository secrets \`UPLOAD_KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, \`KEY_ALIAS\`, and \`KEY_PASSWORD\` were not detected."
              echo "An ephemeral RSA-2048 release key was generated in \`RUNNER_TEMP\` so \`:app:assembleRelease\` and \`:app:bundleRelease\` produce installable release artifacts without exposing or committing any credentials."
              echo ""
              echo "#### How to Configure Production Google Play Signing Secrets:"
              echo "1. Encode your upload keystore: \`base64 -w 0 my-upload-key.jks\`"
              echo "2. Open **Settings → Secrets and variables → Actions** in GitHub."
              echo "3. Add \`UPLOAD_KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, \`KEY_ALIAS\` (e.g., \`upload\`), and \`KEY_PASSWORD\`."
            } >> "$GITHUB_STEP_SUMMARY"

            keytool -genkeypair -v \
              -keystore "$TEMP_KS" \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "HisabMateRelease2026!" \
              -keypass "HisabMateRelease2026!" \
              -dname "CN=HisabMate Open Source Release, OU=Mobile Engineering, O=CodeByArnob, L=Dhaka, S=Dhaka, C=BD"
            export KEYSTORE_PATH="$TEMP_KS"
            export STORE_PASSWORD="HisabMateRelease2026!"
            export KEY_PASSWORD="HisabMateRelease2026!"
          fi

          gradle :app:assembleRelease :app:bundleRelease :app:lintVitalRelease --stacktrace
          rm -f "$TEMP_KS"

          mkdir -p release-dist
          cp app/build/outputs/apk/release/*.apk "release-dist/HisabMate-${REL_TAG}-release.apk"
          cp app/build/outputs/bundle/release/*.aab "release-dist/HisabMate-${REL_TAG}-release.aab"
          (cd release-dist && sha256sum "HisabMate-${REL_TAG}-release.apk" "HisabMate-${REL_TAG}-release.aab" > SHA256SUMS.txt)

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          AAPT2=$(find "${ANDROID_HOME}/build-tools" -name "aapt2" | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "release-dist/HisabMate-${REL_TAG}-release.apk"
          "$AAPT2" dump badging "release-dist/HisabMate-${REL_TAG}-release.apk" | head -n 20

      - name: Upload Release Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hisabmate-${{ steps.build_release.outputs.release_tag }}-release-assets
          path: release-dist/*

      - name: Attach APK, AAB & SHA256SUMS to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ steps.build_release.outputs.release_tag }}
        run: |
          if gh release view "${REL_TAG}" >/dev/null 2>&1; then
            gh release upload "${REL_TAG}" \
              "release-dist/HisabMate-${REL_TAG}-release.apk" \
              "release-dist/HisabMate-${REL_TAG}-release.aab" \
              "release-dist/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "${REL_TAG}" \
              "release-dist/HisabMate-${REL_TAG}-release.apk" \
              "release-dist/HisabMate-${REL_TAG}-release.aab" \
              "release-dist/SHA256SUMS.txt" \
              --title "HisabMate ${REL_TAG} — Production Release" \
              --generate-notes
          fi
