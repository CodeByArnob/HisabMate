name: Release Build & Artifact Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v1.0.3)'
        required: true

permissions:
  contents: write

jobs:
  release-artifacts:
    name: Build, Sign & Attach Release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit, Robolectric & Lint Verification Suite
        run: gradle :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Validate Release Version and Require Persistent Signing Secrets
        id: release_config
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          INPUT_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REL_TAG="${GITHUB_REF_NAME}"
          else
            REL_TAG="${INPUT_TAG:-}"
          fi
          if [[ ! "${REL_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A valid release tag such as v1.0.7 is required."
            exit 1
          fi

          APP_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "${APP_VERSION}" || "v${APP_VERSION}" != "${REL_TAG}" ]]; then
            echo "::error::Release tag ${REL_TAG} does not match app versionName ${APP_VERSION:-<missing>}."
            exit 1
          fi

          if [[ -z "${UPLOAD_KEYSTORE_BASE64}" || -z "${STORE_PASSWORD}" || -z "${KEY_PASSWORD}" ]]; then
            {
              echo "### Release blocked: persistent signing secrets are missing"
              echo "Configure UPLOAD_KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD in repository Actions secrets."
              echo "The release workflow intentionally refuses to publish APKs signed with a temporary key."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Persistent production signing secrets are required. No temporary release key will be generated."
            exit 1
          fi

          TEMP_KS="${RUNNER_TEMP}/hisabmate-production-upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$TEMP_KS"
          test -s "$TEMP_KS"
          keytool -list -keystore "$TEMP_KS" -storepass "$STORE_PASSWORD" -alias upload >/dev/null
          echo "KEYSTORE_PATH=$TEMP_KS" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "release_tag=$REL_TAG" >> "$GITHUB_OUTPUT"

      - name: Run Tests, Lint and Build Signed Release APK + AAB
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          gradle :app:testDebugUnitTest :app:lintDebug :app:lintVitalRelease :app:assembleRelease :app:bundleRelease --stacktrace

          REL_TAG="${{ steps.release_config.outputs.release_tag }}"
          mkdir -p release-dist
          cp app/build/outputs/apk/release/*.apk "release-dist/HisabMate-${REL_TAG}-release.apk"
          cp app/build/outputs/bundle/release/*.aab "release-dist/HisabMate-${REL_TAG}-release.aab"

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "release-dist/HisabMate-${REL_TAG}-release.apk" > release-dist/SIGNING-CERTIFICATE.txt
          jarsigner -verify "release-dist/HisabMate-${REL_TAG}-release.aab"
          (cd release-dist && sha256sum "HisabMate-${REL_TAG}-release.apk" "HisabMate-${REL_TAG}-release.aab" > SHA256SUMS.txt)

      - name: Upload Verified Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hisabmate-${{ steps.release_config.outputs.release_tag }}-release
          path: release-dist/*

      - name: Attach Release APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ steps.release_config.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" \
              "release-dist/HisabMate-${REL_TAG}-release.apk" \
              "release-dist/HisabMate-${REL_TAG}-release.aab" \
              "release-dist/SHA256SUMS.txt" \
              "release-dist/SIGNING-CERTIFICATE.txt" \
              --clobber
          else
            gh release create "$REL_TAG" \
              "release-dist/HisabMate-${REL_TAG}-release.apk" \
              "release-dist/HisabMate-${REL_TAG}-release.aab" \
              "release-dist/SHA256SUMS.txt" \
              "release-dist/SIGNING-CERTIFICATE.txt" \
              --title "HisabMate ${REL_TAG} — Production Release" \
              --generate-notes
          fi
