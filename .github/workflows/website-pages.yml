name: Deploy Project Website to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'website/**'
      - 'docs/screenshots/**'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-site:
    name: Prepare Static Website Bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Validate website scripts and resilient icon fallbacks
        run: |
          set -euo pipefail
          node --check website/script.js
          icon_count="$(grep -o 'class="feature-motion-icon"' website/index.html | wc -l | tr -d ' ')"
          test "$icon_count" -eq 3
          if grep -q 'lottie-web' website/index.html; then
            echo "Unexpected remote Lottie dependency remains in the website."
            exit 1
          fi

      - name: Assemble Website & Genuine Visual Assets
        run: |
          mkdir -p _site/assets/screenshots
          cp -r website/* _site/
          if [ -d docs/screenshots ]; then
            cp -r docs/screenshots/*.png _site/assets/screenshots/ 2>/dev/null || true
            cp -r docs/screenshots/*.svg _site/assets/screenshots/ 2>/dev/null || true
            cp -r docs/screenshots/*.gif _site/assets/screenshots/ 2>/dev/null || true
          fi
          touch _site/.nojekyll
          ls -la _site/ _site/assets/screenshots/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy-site:
    name: Publish to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build-site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
