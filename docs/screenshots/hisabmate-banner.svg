    <text x="0" y="148" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.2">HisabMate</text>
    <text x="292" y="148" fill="url(#accentGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.2">v1.0.0</text>

