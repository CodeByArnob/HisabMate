    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E263D" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#131929" stop-opacity="0.96" />
