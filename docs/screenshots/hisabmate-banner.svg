      <stop offset="0%" stop-color="#090D16" />
      <stop offset="52%" stop-color="#11182A" />
      <stop offset="100%" stop-color="#181236" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
