    <text x="44" y="214" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">৳ BDT  •  $ USD  •  € EUR  •  £ GBP  •  ₹ INR  •  ¥ JPY</text>

