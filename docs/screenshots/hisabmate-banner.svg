    <text x="212" y="129" fill="#FDA4AF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">MONTHLY SPEND</text>
    <text x="212" y="152" fill="#FFF1F2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">-৳64,890</text>

