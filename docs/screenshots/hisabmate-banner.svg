    <text x="126" y="28" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">GLOBAL MULTI-CURRENCY FINTECH</text>

    <text x="94" y="66" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Offline-First Android Personal Finance • Jetpack Compose • Room SQLite</text>

